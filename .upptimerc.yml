# Upptime configuration
# Docs: https://upptime.js.org/docs/configuration

# Repository settings
owner: 17labs-ai          # Your GitHub org/user
repo: status-page         # Your Upptime repository name

# Monitoring targets
sites:
  - name: 17labs — Landing
    url: https://17labs.ai
    maxResponseTime: 8000

  - name: 17labs — Login
    url: https://sso.17labs.ai
    maxResponseTime: 8000

  - name: CCAR-F Academy — Landing
    url: https://ccar-f.17labs.ai
    maxResponseTime: 8000
    
  - name: Dealya — Landing
    url: https://dealya.ai
    maxResponseTime: 8000

  - name: PandaFind — Landing
    url: https://pandafind.app
    maxResponseTime: 8000

  - name: TaskNotify — Landing
    url: https://tasknotify.app
    maxResponseTime: 8000

  - name: TaskNotify — Login
    url: https://sso.17labs.ai/auth/realms/tasknotify/protocol/openid-connect/auth?client_id=tasknotify-gpt-app-client&redirect_uri=https%3A%2F%2Fchatgpt.com%2Fconnector_platform_oauth_redirect&response_type=code&scope=openid
    maxResponseTime: 8000

  - name: Flashcards — Landing
    url: https://deckweave.17labs.ai
    maxResponseTime: 8000

  - name: Flashcards — Login
    url: https://sso.17labs.ai/auth/realms/flashcards/protocol/openid-connect/auth?client_id=flashcards-gpt-app-client&redirect_uri=https%3A%2F%2Fchatgpt.com%2Fconnector_platform_oauth_redirect&response_type=code&scope=openid
    maxResponseTime: 8000
    
# Status website
status-website:
  cname: status.17labs.ai
  # baseUrl: /status   # Use instead of cname if not on a custom domain

  name: 17labs Service Status

  # Logo not available yet
  # logoUrl: https://17labs.ai/logo.svg
  # favicon: https://17labs.ai/favicon.ico

  introTitle: "Service Status"
  introMessage: >
    This page provides real-time availability and incident history for 17labs services.
    If you are experiencing an issue not listed here, please contact our support team.

  navbar:
    - title: Status
      href: /

    # - title: Main Site
    #   href: https://17labs.ai

    - title: Support
      href: mailto:support@17labs.ai

    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  theme: dark
