# Upptime configuration
# Docs: https://upptime.js.org/docs/configuration

# Repository settings
owner: 17labs-ai          # Your GitHub org/user
repo: status-page         # Your Upptime repository name

# Monitoring targets
sites:
  - name: 17labs — Web
    url: https://17labs.ai
    maxResponseTime: 8000
    
  - name: Dealya — Web
    url: https://dealya.ai
    maxResponseTime: 8000

  #- name: Dealya — API (Health)
  #  url: https://api.dealya.ai/health
  #  maxResponseTime: 8000

  - name: PandaFind — Web
    url: https://pandafind.app
    maxResponseTime: 8000

  # 17labs.ai only 302s here, and a redirect alone counts as up — so the landing
  # needs its own check or an outage of it stays invisible on the status page.

  - name: PandaFind — MCP
    url: https://api.pandafind.app/mcp
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
    # The server is a stateless transport, so a repeated initialize leaves nothing behind.
    # /health, /ready and /status are not reachable publicly; this is the real product surface.
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"upptime","version":"1"}}}'
    maxResponseTime: 8000

  - name: TaskNotify — Web
    url: https://tasknotify.app
    maxResponseTime: 8000

  - name: TaskNotify — API (Health)
    url: https://api.tasknotify.app/health
    maxResponseTime: 8000

  - name: Flashcards — Web
    url: https://deckweave.17labs.ai
    maxResponseTime: 8000

  - name: Flashcards — API (Health)
    url: https://mcp-flashcards.17labs.ai/health
    maxResponseTime: 8000

  - name: Flashcards — Login (Health)
    url: https://sso.17labs.ai/auth/realms/flashcards/protocol/openid-connect/auth?client_id=flashcards-gpt-app-client&redirect_uri=https%3A%2F%2Fchatgpt.com%2Fconnector_platform_oauth_redirect&response_type=code&scope=openid
    maxResponseTime: 8000
    
# Status website
status-website:
  cname: status.17labs.ai
  # baseUrl: /status   # Use instead of cname if not on a custom domain

  name: 17labs Service Status

  # Logo not available yet
  # logoUrl: https://17labs.ai/logo.svg
  # favicon: https://17labs.ai/favicon.ico

  introTitle: "Service Status"
  introMessage: >
    This page provides real-time availability and incident history for 17labs services.
    If you are experiencing an issue not listed here, please contact our support team.

  navbar:
    - title: Status
      href: /

    # - title: Main Site
    #   href: https://17labs.ai

    - title: Support
      href: mailto:support@17labs.ai

    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  theme: dark
